name: CI

# Corre las pruebas de los tres stacks en cada push/PR a main y develop.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  dotnet:
    name: .NET (xUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar
        run: dotnet restore Gestion.Api.Tests/Gestion.Api.Tests.csproj
      - name: Pruebas
        run: dotnet test Gestion.Api.Tests/Gestion.Api.Tests.csproj --no-restore --verbosity normal

  nest:
    name: NestJS (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api-nest/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Angular (Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # ubuntu-latest trae Google Chrome preinstalado; Karma lo detecta.
      - run: npm run test:ci
